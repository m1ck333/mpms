name: FE CI

# Frontend checks + typecheck + tests + build. Runs only when fe/ changes.
on:
  push:
    branches: [staging, main]
    paths: ['fe/**', '.github/workflows/fe.yml']
  pull_request:
    branches: [staging, main]
    paths: ['fe/**', '.github/workflows/fe.yml']

concurrency:
  group: fe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks + typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: i18n key check
        run: pnpm check:i18n
      - name: i18n placeholder + empty value check
        run: pnpm check:i18n-params
      - name: brand-leak check
        run: pnpm check:brand
      - name: hardcoded-color check
        run: pnpm check:colors
      - name: file-size check
        run: pnpm check:size
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck

      # All workspace test suites (dashboard, tablet, api-client, auth).
      - name: unit tests
        run: pnpm -r test

      - name: build dashboard
        run: pnpm --filter dashboard build
      - name: build tablet
        run: pnpm --filter tablet build
