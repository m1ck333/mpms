name: E2E

# Full-stack Playwright: Postgres service + the BE (be/) + the FE dashboard
# (fe/) served via vite preview, driven by Chromium. In the monorepo the BE
# is in-tree, so this no longer needs a cross-repo checkout or a PAT.
#
# Opt-in gate: set repo VARIABLE E2E_ENABLED = "true" to run it (skipped otherwise).

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: full-stack Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ vars.E2E_ENABLED == 'true' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mpms_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4   # one checkout — both be/ and fe/

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore BE
        working-directory: be
        run: dotnet restore
      - name: Build BE
        working-directory: be
        run: dotnet build --no-restore --configuration Release
      - name: Start BE
        working-directory: be
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=mpms_e2e;Username=postgres;Password=postgres"
          ASPNETCORE_URLS: "http://localhost:5030"
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          nohup dotnet run --project AlgreenMES.API --no-build --configuration Release > be.log 2>&1 &
          echo "BE_PID=$!" >> $GITHUB_ENV
      - name: Wait for BE health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5030/api/health/ready >/dev/null 2>&1; then
              echo "BE ready after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "BE did not become ready in 120s:"; tail -100 be/be.log || true; exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Install FE deps
        working-directory: fe
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: fe
        run: pnpm exec playwright install --with-deps chromium
      - name: Build dashboard
        working-directory: fe
        env:
          VITE_API_BASE_URL: http://localhost:5030/api
          VITE_SIGNALR_URL: http://localhost:5030/hubs/production
        run: pnpm --filter dashboard build
      - name: Serve dashboard
        working-directory: fe
        run: |
          nohup pnpm --filter dashboard exec vite preview --port 5941 --host > fe.log 2>&1 &
          for i in {1..15}; do
            if curl -fsS http://localhost:5941/ >/dev/null 2>&1; then echo "FE ready"; exit 0; fi
            sleep 1
          done
          echo "FE did not start:"; tail -50 fe.log || true; exit 1

      - name: Run Playwright
        working-directory: fe
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5941
          E2E_ADMIN_PASSWORD: Admin123!
          E2E_TENANT_CODE: DEMO
          E2E_ADMIN_EMAIL: admin@demo.com
        run: pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            fe/playwright-report/
            fe/test-results/
          retention-days: 14

      - name: Stop BE
        if: always()
        run: kill ${{ env.BE_PID }} 2>/dev/null || true
